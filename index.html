<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRID</title>
    <style>
        .grid-contaner{
            width: 100%;
            height: 1000px;
            background-color: brown;
 
            /*
            MODULO GRID
            */
            display: grid;
            /*Grid Template*/
            grid-template-areas:
            "header"
            "nav"
            "main"
            "contenido1"
            "contenido2 "
            "aside"
            "footer";
            grid-template-columns: 1fr;
            grid-template-rows: .7fr .5fr 1fr 1fr .5fr 1fr 1fr;
        }
        .item1{
            grid-area: header;
            background-color: rgb(0, 153, 255);
            text-align: center;
            
            
        }
        .item2{
            grid-area: nav;
            background-color: rgb(121, 54, 141);
            text-align: center;
        }
        .item3{
            grid-area: main;
            background-color: rgb(32, 89, 27);
            text-align: center;
        }
        .item4{
            grid-area: aside;
            background-color: rgb(119, 116, 254);
            text-align: center;
        }
        .item5{
            grid-area: contenido1;
            background-color: rgb(179, 25, 153);
            text-align: center;
        }
        .item6{
            grid-area: contenido2;
            background-color: rgb(150, 11, 127);
            text-align: center;
        }
        .item7{
            grid-area: footer;
            background-color: rgb(72, 92, 182);
            text-align: center;
        }
        @media screen and (min-width: 720px){
            .grid-contaner{
            width: 100%;
            height: 1000px;
            background-color: brown;
 
            /*
            MODULO GRID
            */
            display: grid;
            /*Grid Template*/
            grid-template-areas:
            "header header header"
            "nav     nav   nav"
            "main    main   aside"
            "contenido1 contenido2 aside"
            "footer footer footer";
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: .7fr .5fr 1fr 1fr .5fr;
        }
        .item1{
            grid-area: header;
            background-color: rgb(0, 153, 255);
            text-align: center;
            
            
        }
        .item2{
            grid-area: nav;
            background-color: rgb(121, 54, 141);
            text-align: center;
        }
        .item3{
            grid-area: main;
            background-color: rgb(32, 89, 27);
            text-align: center;
        }
        .item4{
            grid-area: aside;
            background-color: rgb(119, 116, 254);
            text-align: center;
        }
        .item5{
            grid-area: contenido1;
            background-color: rgb(179, 25, 153);
            text-align: center;
        }
        .item6{
            grid-area: contenido2;
            background-color: rgb(150, 11, 127);
            text-align: center;
        }
        .item7{
            grid-area: footer;
            background-color: rgb(72, 92, 182);
            text-align: center;
        }
            

            
        }
        
        
    </style>
</head>
<body>
    <section class="grid-contaner">
        <div class="grid-item item1"><h1>HEADER</h1></div>
        <div class="grid-item item2"><h1>NAV</h1></div>
        <div class="grid-item item3"></div>
        <div class="grid-item item4"><h1>ASIDE</h1></div>
        <div class="grid-item item5"><h1>CONTENIDO1</h1></div>
        <div class="grid-item item6"><h1>CONTENIDO2</h1></div>
        <div class="grid-item item7"><h1>FOOTER</h1></div>
    </section>
</body>



</html>
